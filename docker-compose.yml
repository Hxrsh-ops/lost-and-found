version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: lostandfound
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lostandfound"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: eclipse-temurin:21-jdk
    working_dir: /app/backend
    volumes:
      - .:/app
      - maven-repo:/root/.m2
    command: ./mvnw spring-boot:run
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/lostandfound
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=lostandfound
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=dGhpcy1pcy1hLXNlY3VyZS1kZXYtamd0LXNlY3JldC1rZXktZm9yLWxvc3QtYW5kLWZvdW5kLWh1Yi0yMDI2
      - JWT_EXPIRATION_MS=86400000
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - STORAGE_TYPE=local
      - STORAGE_UPLOAD_DIR=/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  maven-repo:
