spring:
  application:
    name: lost-and-found-hub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lostandfound}}
    username: ${DATABASE_USERNAME:${DB_USERNAME:postgres}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1kZXYtamd0LXNlY3JldC1rZXktZm9yLWxvc3QtYW5kLWZvdW5kLWh1Yi0yMDI2}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  lifecycle:
    archive-after-days: ${ARCHIVE_AFTER_DAYS:30}
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      upload-dir: ${STORAGE_UPLOAD_DIR:./uploads}

logging:
  level:
    root: INFO
    com.campus.lostfound: INFO
